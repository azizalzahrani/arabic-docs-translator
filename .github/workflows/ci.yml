# AZION OS · does this build.
#
# Added on 16 August 2026. Installing the package is itself the first real test:
# a broken dependency pin or a missing module shows up here rather than on the
# machine of whoever clones it next.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then pip install -e .; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Tests
        run: |
          if [ -d tests ]; then pip install pytest && pytest -q; else echo "No tests directory. Install succeeded, which is the only claim this run makes."; fi
